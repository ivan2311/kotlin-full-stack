## Gradle
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

## Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

## Compose Multiplatform / Kotlin Wasm
org.jetbrains.compose.experimental.wasm.enabled=true

## Android (only read by the Android Gradle plugin when the Android target is built,
## i.e. with -Ppredictor.android=true; ignored by the default JVM/iOS/Wasm build). The
## :web app and Compose Multiplatform pull in AndroidX, so AGP requires this to be on.
android.useAndroidX=true
