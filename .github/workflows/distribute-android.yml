name: Distribute Android (Firebase App Distribution)

# Builds the Android APK and ships it to testers via Firebase App Distribution.
# This is a SEPARATE, manually-triggered workflow — the main CI (ci.yml) still runs the
# default JVM/iOS/Wasm build and never touches Android or Firebase.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT — a service-account JSON key with the "Firebase App
#                              Distribution Admin" role. Paste the raw JSON file
#                              contents, or a base64 blob — both are accepted.
# Optional secrets:
#   FIREBASE_APP_ID          — override the app id baked into the Gradle config
#                              (defaults to the predictor-5f15e project's Android app)
#   FIREBASE_GROUPS          — default comma-separated tester group aliases (overridable below)
on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Comma-separated Firebase tester group aliases (overrides the FIREBASE_GROUPS secret)"
        required: false
        default: ""
      releaseNotes:
        description: "Release notes shown to testers"
        required: false
        default: ""
      apiBaseUrl:
        description: "Base URL of the deployed API the distributed app should talk to"
        required: false
        default: "https://kotlin-full-stack-production.up.railway.app"

permissions:
  contents: read

concurrency:
  group: distribute-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Build & distribute debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secret is present
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::Missing required secret FIREBASE_SERVICE_ACCOUNT. See docs/firebase-app-distribution.md."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Accept the secret as either the raw service-account JSON or a base64 blob —
          # try JSON first, fall back to base64-decoding, error if it's neither.
          python3 - "$RUNNER_TEMP/firebase-service-account.json" <<'PY'
          import base64, json, os, sys

          raw = os.environ["FIREBASE_SERVICE_ACCOUNT"]
          dest = sys.argv[1]

          def as_json(text):
              try:
                  json.loads(text)
                  return text
              except Exception:
                  return None

          content = as_json(raw)
          if content is None:
              try:
                  content = as_json(base64.b64decode(raw).decode("utf-8"))
              except Exception:
                  content = None
          if content is None:
              sys.exit("::error::FIREBASE_SERVICE_ACCOUNT is neither valid JSON nor base64-encoded JSON.")

          with open(dest, "w") as f:
              f.write(content)
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # Build the debug APK (auto-signed with the debug keystore, so testers can install it),
      # then upload it. Both the Android and Firebase opt-ins are turned on for this run only.
      - name: Build & upload to Firebase App Distribution
        env:
          FIREBASE_GROUPS: ${{ github.event.inputs.groups != '' && github.event.inputs.groups || secrets.FIREBASE_GROUPS }}
          FIREBASE_RELEASE_NOTES: ${{ github.event.inputs.releaseNotes }}
          # Point the distributed APK at the deployed server (testers run on real devices,
          # so the emulator-loopback default would be unreachable). Baked into BuildConfig.
          API_BASE_URL: ${{ github.event.inputs.apiBaseUrl }}
          # Stamp a fresh, increasing version so each distributed build is distinct.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          ./gradlew :web:assembleDebug :web:appDistributionUploadDebug \
            -Ppredictor.android=true -Ppredictor.firebase=true --stacktrace
