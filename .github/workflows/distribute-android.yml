name: Distribute Android (Firebase App Distribution)

# Builds the Android APK and ships it to testers via Firebase App Distribution.
# This is a SEPARATE, manually-triggered workflow — the main CI (ci.yml) still runs the
# default JVM/iOS/Wasm build and never touches Android or Firebase.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT — base64 of a service-account JSON key with the
#                              "Firebase App Distribution Admin" role
#                              (create it, then: base64 -w0 service-account.json)
# Optional secrets:
#   FIREBASE_APP_ID          — override the app id baked into the Gradle config
#                              (defaults to the predictor-5f15e project's Android app)
#   FIREBASE_GROUPS          — default comma-separated tester group aliases (overridable below)
on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Comma-separated Firebase tester group aliases (overrides the FIREBASE_GROUPS secret)"
        required: false
        default: ""
      releaseNotes:
        description: "Release notes shown to testers"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: distribute-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Build & distribute debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secret is present
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::Missing required secret FIREBASE_SERVICE_ACCOUNT. See docs/firebase-app-distribution.md."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # Build the debug APK (auto-signed with the debug keystore, so testers can install it),
      # then upload it. Both the Android and Firebase opt-ins are turned on for this run only.
      - name: Build & upload to Firebase App Distribution
        env:
          FIREBASE_GROUPS: ${{ github.event.inputs.groups != '' && github.event.inputs.groups || secrets.FIREBASE_GROUPS }}
          FIREBASE_RELEASE_NOTES: ${{ github.event.inputs.releaseNotes }}
          # Stamp a fresh, increasing version so each distributed build is distinct.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          ./gradlew :web:assembleDebug :web:appDistributionUploadDebug \
            -Ppredictor.android=true -Ppredictor.firebase=true --stacktrace
